name: CI

on:
  push:
    branches: [main, "copilot/**"]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 4 * * 1"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  DBUSCXX_VERSION: 2.6.2

jobs:
  build-and-test:
    name: Build & Test (${{ matrix.preset }})
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        preset: [dev, asan]

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        uses: ./.github/actions/install-deps
        with:
          extra-packages: libgtest-dev lcov

      - name: Configure (${{ matrix.preset }})
        run: cmake --preset ${{ matrix.preset }}

      - name: Build (${{ matrix.preset }})
        run: cmake --build --preset ${{ matrix.preset }}

      - name: Test (${{ matrix.preset }})
        run: ctest --preset ${{ matrix.preset }} --output-on-failure

      - name: Upload failure artifacts (${{ matrix.preset }})
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ctest-${{ matrix.preset }}-logs
          path: |
            build/${{ matrix.preset }}/Testing/Temporary/**
            build/${{ matrix.preset }}/release-manifest.json

  integration:
    name: Integration
    runs-on: ubuntu-22.04
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        uses: ./.github/actions/install-deps
        with:
          extra-packages: libgtest-dev

      - name: Configure integration
        run: cmake --preset integration

      - name: Build integration
        run: cmake --build --preset integration

      - name: Run integration tests
        env:
          TMPDIR: ${{ github.workspace }}/build/integration/tmp
        run: |
          mkdir -p "$TMPDIR"
          ctest --preset integration -L integration --output-on-failure

      - name: Upload integration artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: integration-logs
          path: |
            build/integration/Testing/Temporary/**
            build/integration/tmp/**

  fuzz-smoke:
    name: Fuzz smoke
    runs-on: ubuntu-22.04
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        uses: ./.github/actions/install-deps
        with:
          extra-packages: clang
          cc: clang
          cxx: clang++

      - name: Configure fuzz
        run: cmake --preset fuzz

      - name: Build fuzz
        run: cmake --build --preset fuzz

      - name: Run fuzz smoke tests
        run: ctest --preset fuzz -L fuzz-smoke --output-on-failure

      - name: Upload fuzz artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-smoke-logs
          path: |
            build/fuzz/Testing/Temporary/**

  release-package:
    name: Release package validation
    runs-on: ubuntu-22.04
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        uses: ./.github/actions/install-deps
        with:
          extra-packages: libgtest-dev

      - name: Configure release package
        run: cmake --preset release-package

      - name: Build release package
        run: cmake --build --preset release-package

      - name: Test installed package surface
        run: ctest --preset release-package -L package --output-on-failure

      - name: Build TGZ and DEB packages
        run: |
          set -euxo pipefail
          cpack --config build/release-package/CPackConfig.cmake -G TGZ
          cpack --config build/release-package/CPackConfig.cmake -G DEB

      - name: Upload package artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-packages
          path: |
            build/release-package/packages/**
            build/release-package/release-manifest.json

  architecture-checks:
    name: Architecture checks
    runs-on: ubuntu-22.04
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: No transport types in interop_contract
        run: sh tools/check_no_transport_in_interop_contract.sh

      - name: Component boundary enforcement
        run: sh tools/check_component_boundaries.sh .

  resilience:
    name: Resilience
    runs-on: ubuntu-22.04
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        uses: ./.github/actions/install-deps
        with:
          extra-packages: libgtest-dev

      - name: Configure resilience
        run: cmake --preset dev

      - name: Build resilience
        run: cmake --build --preset dev --target inventory_service_tests network_observation_service_tests service_soak_short_tests

      - name: Run resilience tests
        run: ctest --preset dev --tests-regex 'inventory_service_tests|network_observation_service_tests' -L resilience --output-on-failure --no-tests=error

      - name: Run short soak
        run: ctest --test-dir build/dev -L soak-short --output-on-failure --no-tests=error

      - name: Upload resilience artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: resilience-logs
          path: |
            build/dev/Testing/Temporary/**

  benchmark:
    name: Benchmark build
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    runs-on: ubuntu-22.04
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        uses: ./.github/actions/install-deps

      - name: Configure benchmark
        run: cmake --preset benchmark

      - name: Build benchmark
        run: cmake --build --preset benchmark

      - name: Run benchmarks
        run: ./build/benchmark/tests/benchmarks/rmc_fabric_benchmarks > build/benchmark/benchmark-results.jsonl

      - name: Upload benchmark artifacts
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results
          path: |
            build/benchmark/benchmark-results.jsonl

  soak-long:
    name: Soak long
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    runs-on: ubuntu-22.04
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        uses: ./.github/actions/install-deps
        with:
          extra-packages: libgtest-dev

      - name: Configure soak-long
        run: cmake --preset dev

      - name: Build soak-long
        run: cmake --build --preset dev --target service_soak_short_tests

      - name: Run soak-long
        env:
          RMC_FABRIC_SOAK_CYCLES: 2000
        run: ./build/dev/tests/service_soak_short_tests > build/dev/soak-long-results.jsonl

      - name: Upload soak artifacts
        uses: actions/upload-artifact@v4
        with:
          name: soak-long-results
          path: |
            build/dev/soak-long-results.jsonl

  fuzz-long:
    name: Fuzz long
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    runs-on: ubuntu-22.04
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        uses: ./.github/actions/install-deps
        with:
          extra-packages: clang
          cc: clang
          cxx: clang++

      - name: Configure fuzz-long
        run: cmake --preset fuzz

      - name: Build fuzz-long
        run: cmake --build --preset fuzz

      - name: Run fuzz-long
        run: |
          ./build/fuzz/tests/fuzz/inventory_dbus_codec_fuzz -runs=5000 tests/fuzz/corpus/inventory
          ./build/fuzz/tests/fuzz/network_observation_dbus_codec_fuzz -runs=5000 tests/fuzz/corpus/network-observation

      - name: Upload fuzz artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-long-logs
          path: |
            build/fuzz/Testing/Temporary/**
