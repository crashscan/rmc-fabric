name: CI

on:
  push:
    branches: [main, "copilot/**"]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    name: Build & Test (${{ matrix.preset }})
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        preset: [dev, asan]

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y \
            cmake ninja-build pkg-config curl \
            libgoogle-glog-dev libgflags-dev \
            libjsoncpp-dev \
            nlohmann-json3-dev \
            libsigc++-3.0-dev \
            libgtest-dev \
            liblldpctl-dev \
            lcov

      - name: Build and install DBusCxx
        run: |
          curl -L https://github.com/dbus-cxx/dbus-cxx/archive/refs/tags/2.6.2.tar.gz \
            -o /tmp/dbus-cxx-2.6.2.tar.gz
          tar -C /tmp -xzf /tmp/dbus-cxx-2.6.2.tar.gz
          cmake -S /tmp/dbus-cxx-2.6.2 -B /tmp/dbus-cxx-build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_TESTING=OFF \
            -DENABLE_EXAMPLES=OFF \
            -DENABLE_TOOLS=OFF \
            -DENABLE_GLIB_SUPPORT=OFF \
            -DENABLE_QT_SUPPORT=OFF \
            -DENABLE_UV_SUPPORT=OFF
          cmake --build /tmp/dbus-cxx-build
          sudo cmake --install /tmp/dbus-cxx-build
          sudo ldconfig

      - name: Configure (${{ matrix.preset }})
        run: cmake --preset ${{ matrix.preset }}

      - name: Build (${{ matrix.preset }})
        run: cmake --build --preset ${{ matrix.preset }}

      - name: Test (${{ matrix.preset }})
        run: ctest --preset ${{ matrix.preset }} --output-on-failure

  release-build:
    name: Release build
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y \
            cmake ninja-build pkg-config curl \
            libgoogle-glog-dev libgflags-dev \
            libjsoncpp-dev \
            nlohmann-json3-dev \
            libsigc++-3.0-dev \
            liblldpctl-dev

      - name: Build and install DBusCxx
        run: |
          curl -L https://github.com/dbus-cxx/dbus-cxx/archive/refs/tags/2.6.2.tar.gz \
            -o /tmp/dbus-cxx-2.6.2.tar.gz
          tar -C /tmp -xzf /tmp/dbus-cxx-2.6.2.tar.gz
          cmake -S /tmp/dbus-cxx-2.6.2 -B /tmp/dbus-cxx-build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_TESTING=OFF \
            -DENABLE_EXAMPLES=OFF \
            -DENABLE_TOOLS=OFF \
            -DENABLE_GLIB_SUPPORT=OFF \
            -DENABLE_QT_SUPPORT=OFF \
            -DENABLE_UV_SUPPORT=OFF
          cmake --build /tmp/dbus-cxx-build
          sudo cmake --install /tmp/dbus-cxx-build
          sudo ldconfig

      - name: Configure (release)
        run: cmake --preset release

      - name: Build (release)
        run: cmake --build --preset release

  architecture-checks:
    name: Architecture checks
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4

      - name: No transport types in interop_contract
        run: sh tools/check_no_transport_in_interop_contract.sh

      - name: Component boundary enforcement
        run: sh tools/check_component_boundaries.sh .
