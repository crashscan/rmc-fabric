<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<busconfig>
  <!-- Daemon runs as root on the appliance; allow it to own the name -->
  <policy user="root">
    <allow own="org.rsc.Inventory"/>
  </policy>

  <!-- Any local client may query and subscribe -->
  <policy context="default">
    <allow send_destination="org.rsc.Inventory"/>
    <allow receive_sender="org.rsc.Inventory"/>
  </policy>
</busconfig>
