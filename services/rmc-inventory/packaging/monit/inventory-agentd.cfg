check process inventory-agentd with pidfile /run/inventory-agent/inventory-agentd.pid
    start program = "/usr/libexec/inventory-agent/start-inventory-agentd" with timeout 60 seconds
    stop program  = "/usr/libexec/inventory-agent/stop-inventory-agentd" with timeout 60 seconds
    if 5 restarts within 10 cycles then unmonitor
    group inventory-agent

check program inventory-agentd-health with path "/usr/libexec/inventory-agent/check-inventory-agentd"
    depends on inventory-agentd
    if status != 0 then exec "/bin/sh -c 'monit restart inventory-agentd'"
    group inventory-agent

