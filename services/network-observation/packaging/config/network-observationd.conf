# network-observationd runtime configuration
# shell-style KEY=VALUE file sourced by wrapper scripts

# Daemon binary and CLI
DAEMON=/usr/sbin/network-observationd
CLI=/usr/bin/net-observe

# Runtime paths
RUNDIR=/run/network-observation
PIDFILE=/run/network-observation/network-observationd.pid
LOGFILE=/var/log/network-observationd.log

# D-Bus / daemon options
TRANSPORT=dbus
TRANSPORT_CONFIG=system

# Readiness / health timing
STARTUP_WAIT_SEC=20
STOP_WAIT_SEC=20
DBUS_REPLY_TIMEOUT_MS=3000

# Optional future flags if/when daemon supports them
# CANDIDATE_AGEOUT=60
# CANDIDATE_EXPIRE=300
# LOG_LEVEL=0